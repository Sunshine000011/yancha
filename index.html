<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>知識の勇者 -クイズ討伐RPG- 究極完全版(490問フルデータ)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght=500;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: "DotGothic16", sans-serif; 
            text-align: center; 
            background: #112; 
            color: #fff; 
            padding-top: 10px; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
        }
        
        #stage { 
            width: 460px; 
            padding: 15px; 
            border: 4px double #fff; 
            position: relative; 
            background-color: #050505;
            overflow: hidden;
            transition: background 0.5s ease-in-out;
        }

        h2 { margin-top: 5px; margin-bottom: 10px; font-size: 20px; }
        
        #boss-area { 
            height: 140px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 10px 0;
            position: relative;
        }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .screen-title {
            font-size: 18px; color: #ffcc00; margin-bottom: 15px;
            text-shadow: 0 0 5px #ff5500;
            padding: 0 20px;
        }
        .btn-menu {
            width: 280px; font-size: 15px; margin: 5px 0; padding: 10px;
            background: #000; color: #fff; border: 2px solid #fff; cursor: pointer;
            font-family: "DotGothic16", sans-serif;
            text-align: left;
            padding-left: 20px;
        }
        .btn-menu:hover { background: #222; color: #00ff00; border-color: #00ff00; }
        
        .btn-easy { border-color: #00ccff; color: #00ccff; }
        .btn-normal { border-color: #00ff00; color: #00ff00; }
        .btn-hard { border-color: #ff3333; color: #ff3333; }
        #btn-oni-mode {
            display: none; 
            border-color: #ff00ff; color: #ff00ff; text-shadow: 0 0 3px #ff00ff; font-weight: bold;
        }
        #btn-oni-mode:hover { background: #330033; box-shadow: 0 0 10px #ff00ff; }

        .btn-g-normal { border-color: #ffaa00; color: #ffaa00; }
        .btn-g-kanji { border-color: #00ccff; color: #00ccff; }
        .btn-g-bio { border-color: #00ff66; color: #00ff66; }
        .btn-sub-kanji { border-color: #00ffff; color: #00ffff; font-size: 14px; }

        .monster-slime {
            width: 70px; height: 60px; background: #00ccff;
            border-radius: 50% 50% 30% 30% / 70% 70% 30% 30% ; position: relative;
            box-shadow: inset -6px -6px 0px #0099cc, 0 0 10px rgba(0,204,255,0.5);
            animation: purupuru 1.2s infinite ease-in-out;
        }
        .monster-slime::before {
            content: "・  ・\n  ω"; white-space: pre; position: absolute; top: 15px; left: 0; width: 100%;
            color: #000; font-family: sans-serif; font-weight: bold; font-size: 16px; text-align: center;
        }
        .monster-ghost {
            width: 60px; height: 70px; background: #fff;
            border-radius: 50% 50% 20% 20% / 50% 50% 50% 50%; position: relative;
            box-shadow: 0 0 15px rgba(255,255,255,0.6); animation: fuwafuwa 1.8s infinite ease-in-out;
        }
        .monster-ghost::before {
            content: "●  ●\n  ▫"; white-space: pre; position: absolute; top: 18px; left: 0; width: 100%;
            color: #222; font-size: 14px; text-align: center; font-weight: bold;
        }
        .monster-dragon {
            width: 90px; height: 80px; background: #ff3333;
            border-radius: 40% 40% 50% 50%; position: relative;
            box-shadow: inset -8px -8px 0px #aa0000, 0 0 15px rgba(255,50,50,0.6);
            animation: purupuru 0.8s infinite ease-in-out;
        }
        .monster-dragon::before {
            content: "▼  ▼\n  皿"; white-space: pre; position: absolute; top: 25px; left: 0; width: 100%;
            color: #fff; font-size: 18px; text-align: center; font-weight: bold; text-shadow: 0 0 5px #000;
        }
        .monster-uramaou {
            width: 80px; height: 80px; background: #111; border: 4px dashed #ff00ff;
            border-radius: 30% 70% 30% 70% / 50% 50% 50% 50%; position: relative;
            box-shadow: 0 0 25px #ff0000, inset 0 0 15px #ff00ff; animation: konton 0.8s infinite linear;
        }
        .monster-uramaou::before {
            content: "👁  👁\n  ▼"; white-space: pre; position: absolute; top: 20px; left: 0; width: 100%;
            color: #ff0033; font-size: 20px; text-align: center; font-weight: bold; text-shadow: 0 0 8px #ff0000;
        }

        @keyframes purupuru { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.1, 0.9); } }
        @keyframes fuwafuwa { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes konton { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .slash-line {
            position: absolute; width: 0%; height: 6px; background: #fff;
            box-shadow: 0 0 15px #00ccff, 0 0 5px #fff; transform: rotate(-35deg);
            top: 50%; left: 10%; opacity: 0; z-index: 10; pointer-events: none;
        }
        @keyframes slash-trigger { 0% { width: 0%; opacity: 1; left: 10%; } 100% { width: 100%; opacity: 0; left: 90%; } }
        .animate-slash { animation: slash-trigger 0.25s ease-out forwards; }
        
        .ultimate-break {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; z-index: 15; pointer-events: none;
        }
        @keyframes ultimate-trigger { 0% { opacity: 0; } 30% { opacity: 0.9; background: #ff00ff; } 60% { opacity: 0.9; background: #00ff66; } 100% { opacity: 0; } }
        .animate-ultimate { animation: ultimate-trigger 0.8s ease-in-out forwards; }

        .effect-red { background: rgba(255, 0, 0, 0.4) !important; }
        .effect-blue { background: rgba(0, 150, 255, 0.3) !important; }
        .effect-green { background: rgba(0, 255, 100, 0.3) !important; }

        .status, .log-box, .input-container, .hissatsu-container, .hint-container {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 6px; border-radius: 4px; position: relative; z-index: 2;
        }
        .status { font-size: 16px; margin: 4px 0; }
        .hp-bar-bg { background: #333; width: 220px; height: 8px; margin: 4px auto; border: 1px solid #fff; overflow: hidden; }
        .hp-bar { background: #00ff00; height: 100%; width: 100%; transition: width 0.3s; }
        .gauge-bar-bg { background: #222; width: 180px; height: 6px; margin: 2px auto; border: 1px solid #ffcc00; overflow: hidden; }
        .gauge-bar { background: linear-gradient(90deg, #ff5500, #ffcc00); height: 100%; width: 0%; transition: width 0.4s; }

        .log-box { 
            border: 2px solid #fff; 
            height: 125px; 
            margin: 8px 0; 
            padding: 8px; 
            overflow-y: auto; 
            text-align: left; 
            font-size: 15px; 
            line-height: 1.5; 
        }
        .question-text { 
            font-family: 'Noto Sans JP', sans-serif; 
            font-size: 19px;                                
            font-weight: 700;                              
            color: #ffff00;                                
            text-align: center; 
            margin-top: 6px; 
            letter-spacing: 1px;                           
            text-shadow: 2px 2px 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; 
        }

        hr { margin: 6px 0; border: 1px dashed #fff; }

        .hint-container { margin-bottom: 6px; text-align: right; }
        .btn-hint {
            font-family: "DotGothic16", sans-serif; font-size: 13px; padding: 4px 10px;
            background: #221133; color: #cc99ff; border: 1px solid #cc99ff; cursor: pointer;
        }
        .btn-hint:hover:not(:disabled) { background: #cc99ff; color: #000; }
        .btn-hint:disabled { background: #111; color: #444; border-color: #444; cursor: not-allowed; }

        .input-container { padding: 10px; border: 2px solid #fff; min-height: 44px; }
        
        .typed-box { display: flex; gap: 8px; width: 100%; }
        .answer-input {
            flex: 1; font-family: "DotGothic16", sans-serif; font-size: 18px; 
            padding: 8px; background: #000; color: #fff; border: 2px solid #555; text-align: center;
        }
        .answer-input:focus { border-color: #00ff00; outline: none; }
        .btn-attack {
            font-family: "DotGothic16", sans-serif; font-size: 16px; padding: 0 15px;
            background: #990000; color: #fff; border: 2px solid #fff; cursor: pointer; font-weight: bold;
        }
        .btn-attack:hover:not(:disabled) { background: #ff0000; color: #fff; box-shadow: 0 0 8px #ff0000; }
        .btn-attack:disabled { background: #111; color: #444; border-color: #444; cursor: not-allowed; }

        .choices-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .btn-choice {
            font-family: "DotGothic16", sans-serif; font-size: 14px; padding: 10px 5px;
            background: #000; color: #fff; border: 2px solid #555; cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .btn-choice:hover:not(:disabled) { border-color: #00ff00; color: #00ff00; background: #111; }
        .btn-choice:disabled { background: #111; color: #444; border-color: #222; cursor: not-allowed; }

        .btn-hissatsu {
            width: 100%; font-size: 16px; font-weight: bold; padding: 8px; margin-bottom: 6px;
            color: #00ff66; border: 2px solid #00ff66; background: linear-gradient(180deg, #020, #000);
            font-family: "DotGothic16", sans-serif; cursor: pointer;
        }
        .btn-hissatsu:hover:not(:disabled) { background: #00ff66; color: #000; box-shadow: 0 0 12px #00ff66; }
        .btn-hissatsu:disabled { background: #111; color: #444; border-color: #444; cursor: not-allowed; }

        .btn-retry {
            width: 100%; font-size: 15px; padding: 10px; background: #000; font-family: "DotGothic16", sans-serif; cursor: pointer;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-6px, 4px); }
            40%, 80% { transform: translate(6px, -4px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="difficulty-screen" class="overlay-screen">
            <div class="screen-title" id="menu-title">⚔️ 難易度 を えらんでください ⚔️</div>
            <button class="btn-menu btn-easy" onclick="selectDifficulty('easy')">▶ らくらく (イージー)</button>
            <button class="btn-menu btn-normal" onclick="selectDifficulty('normal')">▶ ふつう (ノーマル)</button>
            <button class="btn-menu btn-hard" onclick="selectDifficulty('hard')">▶ げきから (ハード)</button>
            <button class="btn-menu btn-oni" id="btn-oni-mode" onclick="selectDifficulty('oni')">💀 鬼ムズ (ぜつぼうクイズ)</button>
        </div>

        <div id="genre-screen" class="overlay-screen" style="display:none;">
            <div class="screen-title">🔮 挑戦するジャンルをえらべ 🔮</div>
            <button class="btn-menu btn-g-normal" onclick="selectGenre('normal')">▶ 一般常識 (4択・全70問)</button>
            <button class="btn-menu btn-g-kanji" onclick="openKanjiMenu()">▶ 漢字の国 (記述・全70問) ➔</button>
            <button class="btn-menu btn-g-bio" onclick="selectGenre('bio')">▶ 生き物たちの世界 (4択・全70問)</button>
        </div>

        <div id="kanji-sub-screen" class="overlay-screen" style="display:none;">
            <div class="screen-title">✍️ 漢字のどの試練に挑む？ (各70問) ✍️</div>
            <button class="btn-menu btn-sub-kanji" onclick="selectGenre('kanji_yomi')">▶ 漢字よみ (標準)</button>
            <button class="btn-menu btn-sub-kanji" onclick="selectGenre('kanji_fish')">▶ 魚の漢字 (魚偏など)</button>
            <button class="btn-menu btn-sub-kanji" onclick="selectGenre('kanji_animal')">▶ 動物漢字 (難読当て字)</button>
            <button class="btn-menu btn-sub-kanji" onclick="selectGenre('kanji_bug')">▶ 虫の漢字 (昆虫など)</button>
            <button class="btn-menu btn-sub-kanji" onclick="selectGenre('kanji_bird')">▶ 鳥の漢字 (鳥類など)</button>
            <button class="btn-menu" style="border-color:#ccc; color:#ccc; font-size:13px; text-align:center; padding-left:0;" onclick="backToGenre()">⬅ ジャンル選択にもどる</button>
        </div>

        <h2 id="stage-title">知識の勇者 -クイズ討伐RPG-</h2>
        
        <div id="boss-area">
            <div id="slash-line" class="slash-line"></div>
            <div id="ultimate-break" class="ultimate-break"></div>
            <div id="enemy-graphic" class=""></div>
        </div>

        <div class="status">
            <div><span id="enemy-name">-</span></div>
            <div class="hp-bar-bg"><div id="maou-hp-bar" class="hp-bar"></div></div>
            <div style="font-size:12px; color:#ffcc00;">HP: <span id="maou-hp">-</span> / <span id="maou-max-hp">-</span></div>
        </div>

        <div class="status" style="border-top:1px solid #333; padding-top:8px;">
            <div style="color:#00ffcc;">勇者 (あなた)</div>
            <div class="hp-bar-bg"><div id="yusha-hp-bar" class="hp-bar" style="background:#00ff00;"></div></div>
            <div style="font-size:12px; color:#00ffcc;">HP: <span id="yusha-hp">100</span> / <span id="yusha-max-hp">100</span></div>
            <div class="gauge-bar-bg"><div id="hissatsu-gauge-bar" class="gauge-bar"></div></div>
            <div style="font-size:11px; color:#ff9900;">必殺ゲージ: <span id="hissatsu-gauge">0</span>%</div>
        </div>

        <div id="log-box" class="log-box">⚔️ 冒険が始まります。難易度を選択してください。</div>

        <div id="hint-box" class="hint-container" style="display:none;">
            <button id="btn-hint" class="btn-hint" onclick="useHint()">💡 ヒントをみる (必殺ゲージ25%消費)</button>
        </div>

        <div id="hissatsu-box" class="hissatsu-container" style="display:block;">
            <button id="btn-hissatsu" class="btn-hissatsu" onclick="triggerHissatsu()" disabled>⚡ 精神統一 (ゲージ100%で発動可能)</button>
        </div>

        <div id="interaction-box" class="input-container"></div>
    </div>

    <script>
        // クイズデータベース (全7ジャンル×70問＝計490問：完全保持)
        const QUIZ_DATABASE = {
            "normal": [
                {q: "日本で一番高い山はどこ？", a: ["富士山", "北岳", "槍ヶ岳", "奥穂高岳"], ans: "富士山", h: "静岡県と山梨県にまたがっています。"},
                {q: "太陽系で一番大きな惑星はどれ？", a: ["地球", "火星", "木星", "土星"], ans: "木星", h: "縞模様と大赤斑が特徴の巨大ガス惑星です。"},
                {q: "英語で「りんご」は何と言う？", a: ["Banana", "Apple", "Orange", "Grape"], ans: "Apple", h: "Aから始まる果物です。"},
                {q: "日本の現在の首都はどこ？", a: ["京都", "大阪", "東京", "横浜"], ans: "東京", h: "新宿に都庁があります。"},
                {q: "水が沸騰する温度は通常何度？", a: ["0度", "50度", "100度", "120度"], ans: "100度", h: "摂氏温度の基準の一つです。"},
                {q: "世界で一番広い面積を持つ国はどこ？", a: ["カナダ", "アメリカ", "中国", "ロシア"], ans: "ロシア", h: "ユーラシア大陸の北部に広がっています。"},
                {q: "人間の骨の数は成人でおよそいくつ？", a: ["約100個", "約200個", "約300個", "約400個"], ans: "約200個", h: "正確には一般的に206個と言われます。"},
                {q: "一年のうちで、昼が一番長い日を何と呼ぶ？", a: ["春分", "夏至", "秋分", "冬至"], ans: "夏至", h: "6月21日頃にあたります。"},
                {q: "トランプのカードはジョーカーを除いて全部で何枚？", a: ["48枚", "50枚", "52枚", "54枚"], ans: "52枚", h: "13枚×4スートです。"},
                {q: "光の三原色に含まれない色はどれ？", a: ["赤", "緑", "青", "黄色"], ans: "黄色", h: "RGBの3つに含まれないものです。"},
                {q: "日本の紙幣で、一万円札に描かれている人物は誰？(2024年7月以降)", a: ["福沢諭吉", "渋沢栄一", "津田梅子", "北里柴三郎"], ans: "渋沢栄一", h: "「日本資本主義の父」と呼ばれた人物。"},
                {q: "ダイヤモンドの主要な構成元素は何？", a: ["酸素", "ケイ素", "炭素", "水素"], ans: "炭素", h: "鉛筆の芯（黒鉛）と同じ元素です。"},
                {q: "日本で最も長い川はどれ？", a: ["利根川", "石狩川", "信濃川", "最上川"], ans: "信濃川", h: "長野県から新潟県へ流れます。"},
                {q: "世界で一番人口が多い国はどこ？(近年1位になった国)", a: ["中国", "インド", "アメリカ", "インドネシア"], ans: "インド", h: "南アジアの大国です。"},
                {q: "平安時代の有名な文学『源氏物語』の作者は誰？", a: ["清少納言", "紫式部", "和泉式部", "樋口一葉"], ans: "紫式部", h: "藤原道長の娘の家庭教師も務めました。"},
                {q: "地球の表面の約何％が海で覆われている？", a: ["約50％", "約60％", "約70％", "約80％"], ans: "約70％", h: "「水の惑星」と呼ばれる理由です。"},
                {q: "サグラダ・ファミリアがある世界的な都市はどこ？", a: ["パリ", "ローマ", "バルセロナ", "マドリード"], ans: "バルセロナ", h: "スペインのカタルーニャ地方です。"},
                {q: "ことわざ「石の上にも何年」？", a: ["一年", "二年", "三年", "五年"], ans: "三年", h: "辛抱していればやがて報われるという意味です。"},
                {q: "世界で一番最初にオリンピックが開催された国は？", a: ["ギリシャ", "イタリア", "フランス", "イギリス"], ans: "ギリシャ", h: "古代オリンピックの聖地です。"},
                {q: "一打でゴルフの穴にボールを入れることを何と言う？", a: ["バーディ", "イーグル", "アルバトロス", "ホールインワン"], ans: "ホールインワン", h: "奇跡のワンショットです。"},
                {q: "植物が光を受けて養分を作る働きを何と言う？", a: ["呼吸", "発酵", "光合成", "蒸散"], ans: "光合成", h: "葉緑体で行われます。"},
                {q: "アメリカ合衆国の現在の首都はどこ？", a: ["ニューヨーク", "ロサンゼルス", "ワシントンD.C.", "シカゴ"], ans: "ワシントンD.C.", h: "ホワイトハウスがあります。"},
                {q: "日本の国番号（国際電話）は何番？", a: ["1", "44", "81", "82"], ans: "81", h: "2桁の数字で、アジアの主要国です。"},
                {q: "1000ミリリットルは何リットル？", a: ["0.1リットル", "1リットル", "10リットル", "100リットル"], ans: "1リットル", h: "牛乳パック1本分の基本サイズ。"},
                {q: "童話『シンデレラ』で、魔法が解ける時間は夜の何時？", a: ["10時", "11時", "12時", "1時"], ans: "12時", h: "時計の針が真上を指す時間です。"},
                {q: "ハチ公の銅像がある日本の有名な駅はどこ？", a: ["新宿駅", "池袋駅", "東京駅", "渋谷駅"], ans: "渋谷駅", h: "スクランブル交差点のすぐ近くです。"},
                {q: "オーストラリアの首都はどこ？", a: ["シドニー", "メルボルン", "キャンベラ", "ブリスベン"], ans: "キャンベラ", h: "シドニーとメルボルンの争いの末に選ばれた都市。"},
                {q: "「15才」のことを漢字二文字の年齢表現で何と言う？", a: ["志学", "弱冠", "而立", "不惑"], ans: "志学", h: "論語の「吾十有五にして学に志す」に由来します。"},
                {q: "日本の都道府県の数は全部でいくつ？", a: ["43個", "45個", "47個", "50個"], ans: "47個", h: "1都1道2府43県です。"},
                {q: "世界三大美女に含まれない人物は誰？", a: ["クレオパトラ", "楊貴妃", "小野小町", "マリー・アントワネット"], ans: "マリー・アントワネット", h: "日本で一般的に言われる三人以外の、フランス王妃。"},
                {q: "音楽の授業でおなじみの「ベートーヴェン」の出身国は？", a: ["ドイツ", "オーストリア", "イタリア", "フランス"], ans: "ドイツ", h: "ボンで生まれ、後にウィーンで活躍しました。"},
                {q: "将棋の駒で、成ると「金」と同じ動きにならないのはどれ？", a: ["歩", "香車", "桂馬", "角"], ans: "角", h: "成ると「竜馬（馬）」になります。"},

            "kanji_bird": [

                {q: "サケが産卵のために戻ってくる場所はどこ？", a: ["自分が生まれた川", "暖かい南の海", "深い深海", "近くの湖"], ans: "自分が生まれた川", h: "母川回帰（ぼせんかいき）と呼ばれる驚異の本能です。"},
                {q: "次のうち、夜行性（夜に活動する）の動物はどれ？", a: ["キリン", "フクロウ", "ハト", "シマウマ"], ans: "フクロウ", h: "大きな目で夜の暗闇を見通して狩りをします。"},
                {q: "ミツバチが仲間に花の場所を教えるためにする行動は？", a: ["鳴き声を出す", "ダンスを踊る", "フェロモンを飛ばす", "体当たりする"], ans: "ダンスを踊る", h: "8の字に飛び回る「ハチのダンス」で距離や方向を伝えます。"},
                {q: "次のうち、自ら光を放つ「発光生物」ではないのはどれ？", a: ["ホタル", "ホタルイカ", "アンコウの提灯", "カブトムシ"], ans: "カブトムシ", h: "カブトムシは光りません。他の3つはルシフェリン等で発光します。"},
                {q: "カンガルーやコアラのように、お腹に袋を持つ動物の分類名は？", a: ["単孔類", "有袋類", "胎盤類", "鳥類"], ans: "有袋類", h: "未熟な状態で赤ちゃんを産み、お腹の袋の乳首で育てます。"},
                {q: "ラクダの背中にあるコブの中身は何が詰まっている？", a: ["大量の水", "脂肪", "筋肉", "骨"], ans: "脂肪", h: "水ではなく、エネルギー源となる脂肪が蓄えられています。"},
                {q: "鳥類の中で、唯一「後ろ向き」に飛ぶことができるのは？", a: ["ハチドリ", "ツバメ", "スズメ", "タカ"], ans: "ハチドリ", h: "超高速の羽ばたき（ホバリング）により、自在にバックできます。"},
                {q: "ヒマワリの花が太陽の方を向く性質を何と言う？", a: ["光合成", "向日性（光屈性）", "蒸散作用", "休眠現象"], ans: "向日性（光屈性）", h: "成長中の若い時期に、太陽を追いかけて首を振ります。"},
                {q: "キノコは植物の仲間ではなく、生物学上どれに分類される？", a: ["細菌類", "菌類（コケ・カビの仲間）", "藻類", "地衣類"], ans: "菌類（コケ・カビの仲間）", h: "光合成を行わず、胞子で増える「菌類」です。"},
                {q: "世界最大のハサミを持つ甲殻類「タカアシガニ」がすむのはどこ？", a: ["浅い砂浜", "マングローブの川", "深海", "サンゴ礁"], ans: "深海", h: "日本の駿河湾などの深い海の底に生息しています。"},
                {q: "カブトムシの幼虫の主食は何？", a: ["木の樹液", "腐葉土（朽ち木）", "花の蜜", "他の虫"], ans: "腐葉土（朽ち木）", h: "土の中の腐った葉っぱや腐植質を食べて大きくなります（成虫は樹液）。"},
                {q: "次のうち、日本に野生の個体が生息していないクマはどれ？", a: ["ツキノワグマ", "ヒグマ", "ホッキョクグマ", "すべてのクマがいる"], ans: "ホッキョクグマ", h: "本州にはツキノワ、北海道にはヒグマがいますが、白熊は北極だけです。"},
                {q: "ワニの性別（オスかメスか）は何によって決まる？", a: ["卵が育つ時の温度", "親の年齢", "生まれた順番", "完全にランダム"], ans: "卵が育つ時の温度", h: "環境変温性決定と呼ばれ、約32度前後を境に性別が変わります。"},
                {q: "コアラが主食として食べる植物の葉は何？", a: ["竹の葉", "ユーカリ", "ササ", "ポプラ"], ans: "ユーカリ", h: "猛毒（青酸系）が含まれるこの葉を、特別に長い盲腸で解毒して食べます。"},
                {q: "蚊の中で、人間の血を吸うのはオス、メスのどっち？", a: ["オスだけ", "メスだけ", "両方吸う", "どちらも吸わない"], ans: "メスだけ", h: "卵を発達させるための栄養（タンパク質）を得るために吸血します（普段は花の蜜）。"},
                {q: "アリの巣の中で、卵を産み続ける役目を持つのは？", a: ["働きアリ", "兵隊アリ", "女王アリ", "オスアリ"], ans: "女王アリ", h: "集団の頂点に立ち、一生のほとんどを産卵に捧げます。"},
                {q: "サボテンの「トゲ」は、植物のどの部分が変化したもの？", a: ["茎", "根", "葉", "花"], ans: "葉", h: "乾燥した砂漠で水分が蒸発するのを防ぐため、針状に退化しました。"},
                {q: "次のうち、毒ヘビではないヘビはどれ？", a: ["マムシ", "ハブ", "アオダイショウ", "ヤマカガシ"], ans: "アオダイショウ", h: "日本一馴染み深い大蛇ですが、毒はありません。マムシ、ハブ、ヤマカガシは猛毒。"},
                {q: "イカの心臓の数は、通常の主心臓のほかにエラ心臓があり、全部でいくつ？", a: ["1つ", "2つ", "3つ", "4つ"], ans: "3つ", h: "エラに血液を送り込む専用の心臓が2つ、体用の心臓が1つあります。"},
                {q: "アサガオの花が咲くタイミングはいつ？", a: ["朝日を浴びたとき", "夜が明ける数時間前", "正午ぴったり", "夕方"], ans: "夜が明ける数時間前", h: "「開花光周性」により、前日の夕方に暗くなってから一定時間後に咲きます。"},
                {q: "トカゲが敵に捕まった時に、尻尾を自分で切り離す行為を何と言う？", a: ["自爆", "自切", "脱皮", "再生"], ans: "自切", h: "切り離された尻尾はしばらく動き回り、敵の目を引きつけます。"},
                {q: "日本固有の鳥で、特別天然記念物に指定されている「トキ」。現在の野生個体の由来はどこの国から贈られたもの？", a: ["ロシア", "韓国", "中国", "アメリカ"], ans: "中国", h: "日本の純国産トキは絶滅してしまい、中国から譲り受けた個体で繁殖させました。"},
                {q: "犬の鼻が常に湿っている（濡れている）理由はなぜ？", a: ["体温を下げるため", "匂いの分子を捕らえやすくするため", "病気を防ぐため", "涙が溢れているため"], ans: "匂いの分子を捕らえやすくするため", h: "湿った鼻で空気中の匂い成分を吸着し、驚異的な嗅覚を発揮します。"},
                {q: "世界最大のカエル「ゴライアスガエル」の体長（足を伸ばさない状態）はどれくらい？", a: ["約15cm", "約30cm", "約60cm", "約1メートル"], ans: "約30cm", h: "体重は3キロを超え、子供の猫くらいの大きさがある巨大カエルです。"},
                {q: "ネコのヒゲの役割として間違っているものはどれ？", a: ["狭い場所を通れるか測る", "風の動きを察知する", "感情を表現する", "食べ物をすり潰す"], ans: "食べ物をすり潰す", h: "ヒゲは非常に敏感なセンサーですが、食事の咀嚼には使いません。"},
                {q: "ジャイアントパンダの主食は竹ですが、本来の消化器官の分類はどれに近い？", a: ["草食動物", "肉食動物", "雑食動物", "鳥類"], ans: "肉食動物", h: "元々は肉食獣（クマの仲間）なので、竹の消化効率は非常に悪いです。"},
                {q: "冬になると、カエルやヘビなどの爬虫類・両生類が土の中で眠ることを何と言う？", a: ["冬眠", "休眠", "仮死状態", "蟄伏"], ans: "冬眠", h: "自分で体温を保てない「変温動物」が寒さをしのぐための手段です。"},
                {q: "チョウの成虫の足は全部で何本？", a: ["4本", "6本", "8本", "10本"], ans: "6本", h: "昆虫なので基本は6本です（タテハチョウ等、2本が退化して4本に見える種もいます）。"},
                {q: "ギネス記録を持つ世界一長寿の脊椎動物「ニシオンデンザメ」の推定寿命は？", a: ["約100年", "約200年", "約400年", "約800年"], ans: "約400年", h: "北極海などの冷たい海で非常にゆっくり成長し、400年も生きるとされています。"},
                {q: "マングローブとは、どのような場所に生える植物の総称？", a: ["砂漠のど真ん中", "高山の岩場", "熱帯・亜熱帯の汽水域（潮が満ちる河口）", "深海の底"], ans: "熱帯・亜熱帯の汽水域（潮が満ちる河口）", h: "海水と淡水が混ざる泥深い場所に、タコ足のような根を張ります。"},
                {q: "ライオンの群れ（プライド）において、主に狩りをするのはどっち？", a: ["オスだけ", "メスだけ", "オスとメス全員で", "子供ライオン"], ans: "メスだけ", h: "体が軽くて敏捷なメスが集団で連携して狩りを行い、タテガミのあるオスは縄張りを守ります。"},
                {q: "タツノオトシゴは生物の分類上、どれに当てはまる？", a: ["魚類", "両生類", "哺乳類", "貝類"], ans: "魚類", h: "トゲトゲした奇妙な姿ですが、エラ呼吸をするヨウジウオ科の「魚」です。"},
                {q: "植物の根から吸い上げられた水が、葉の気孔から気体（水蒸気）となって出ていく働きを何と言う？", a: ["呼吸", "蒸散", "光合成", "凝縮"], ans: "蒸散", h: "植物全体の水分バランスや、体温の上昇を抑える役割があります。"},
                {q: "世界最大の昆虫（体重が最も重い）と言われる、アフリカの甲虫は？", a: ["ヘラクレスオオカブト", "ゴライアスオオツノハナムグリ", "アレクサンドラトリバネアゲハ", "ヨナグニサン"], ans: "ゴライアスオオツノハナムグリ", h: "幼虫の体重は100gを超え、圧倒的な質量を持つ巨大なカナブンの仲間です。"},
                {q: "カタツムリにはオスとメスの区別がある？", a: ["明確に分かれている", "オス・メスの両方の機能を持つ（雌雄同体）", "性別自体がない", "年齢で変わる"], ans: "オス・メスの両方の機能を持つ（雌雄同体）", h: "1匹の体に両方の生殖器官があり、2匹が出会えばどちらも卵を産むことができます。"},
                {q: "鳥類に「歯」がない理由はなぜ？", a: ["進化の過程で抜け落ちた", "体を軽くして空を飛びやすくするため", "丸呑みする方が効率がいいため", "虫しか食べないため"], ans: "体を軽くして空を飛びやすくするため", h: "頭部を少しでも軽くするため歯がなくなり、代わりに頑丈なクチバシと、砂嚢（さのう）という胃で消化します。"},
                {q: "シマウマの「地肌（毛を剃った皮膚）」の色は何色？", a: ["白", "黒", "白と黒の縞模様", "ピンク色"], ans: "黒", h: "実は地肌は真っ黒で、その上に生えている毛だけが白黒の縞模様になっています。"},
                {q: "サメの骨格は、人間の骨と違って全てある共通の柔らかい骨でできている。それは何骨？", a: ["硬骨", "軟骨", "頭蓋骨", "外骨格"], ans: "軟骨", h: "人間の耳や鼻と同じ「軟骨魚類」に分類され、体をしなやかに曲げて泳げます。"},
                {q: "世界一巨大な花「ラフレシア」が、ハエを引き寄せるために放つ強烈な特徴は？", a: ["とても甘いバニラの香り", "腐った肉の臭い", "眩いばかりの光", "大量の蜜"], ans: "腐った肉の臭い", h: "花粉を運んでくれるクロバエを呼び寄せるため、強烈な腐臭を放ちます。"},
                {q: "クラゲの体の成分の、約何％が「水」でできている？", a: ["約50％", "約70％", "約95％", "約99％"], ans: "約95％", h: "ほとんど水の塊で、陸に上げると水分が蒸発して消えてしまうほどです。"},
                {q: "次のうち、完全に陸上だけで一生を過ごし、水中で呼吸できない動物の分類は？", a: ["両生類", "魚類", "爬虫類", "甲殻類"], ans: "爬虫類", h: "ヘビやトカゲは卵に殻があり、子供の時から肺呼吸をします（両生類は子供時代はエラ呼吸）。"},
                {q: "アサリやシジミなどの二枚貝が、水中のプランクトンを食べる時、同時に行っている環境に良い働きは？", a: ["水をきれいにする（ろ過）", "水を酸性にする", "酸素を大量に作る", "塩分濃度を上げる"], ans: "水をきれいにする（ろ過）", h: "1匹の水質浄化能力は非常に高く、干潟のクリーンアップに大貢献しています。"},
                {q: "キリンの首の骨（頸椎）の数はいくつ？", a: ["7個", "12個", "24個", "50個"], ans: "7個", h: "人間やマウスなどの他の多くの哺乳類と、全く同じ「7個」しかありません（1個が巨大）。"},
                {q: "世界一大きな種子（実）をつける植物「オオミヤシ」の実の重さはどれくらい？", a: ["約1kg", "約5kg", "約20kg以上", "約100kg以上"], ans: "約20kg以上", h: "セイシェル諸島にしかなく、双子のような形をした巨大な実は20kgを超えます。"},
                {q: "ダチョウの「目玉1個の重さ」と「脳みその重さ」、重いのはどっち？", a: ["脳みその方が重い", "目玉の方が重い", "完全に同じ重さ", "季節によって変わる"], ans: "目玉の方が重い", h: "巨大な目玉は1個約60gありますが、脳みそはわずか40gほどしかありません。"},
                {q: "植物の細胞にあって、動物の細胞にない、体をカチッと支える構造は何？", a: ["細胞膜", "細胞壁", "核", "細胞質"], ans: "細胞壁", h: "植物が骨格なしでもまっすぐ立てるのは、この頑丈な細胞壁があるおかげです。"},
                {q: "ホタテガイの「黒い点々（ヒモの周りにある粒）」の正体は何？", a: ["全部「目」", "ただの模様", "卵の塊", "毒のトゲ"], ans: "全部「目」", h: "外套膜（ヒモ）の周囲に約80～100個もの「目（外套眼）」があり、光や影を感知します。"},
                {q: "深海魚「デメニギス」の最大の特徴である、透明な頭の中にある緑色の球体の正体は？", a: ["脳みそ", "目玉", "胃袋", "浮き袋"], ans: "目玉", h: "頭の皮膚が完全に透明なドーム状になっており、中の真緑色の目玉を真上に向けて獲物を探します。"},
                {q: "次の昆虫のうち、サナギの時期がない「不完全変態」の虫はどれ？", a: ["カブトムシ", "チョウ", "バッタ", "ハチ"], ans: "バッタ", h: "卵から孵ると親に似た姿（幼虫）をしており、脱皮を繰り返してそのまま成虫になります。"},
                {q: "冬の風物詩「シクラメン」の花びらは、咲くときにどのような向きになる？", a: ["真下に向かって垂れ下がる", "上に向かって反り返る", "横に大きく広がる", "丸く球体になる"], ans: "上に向かって反り返る", h: "元々は下向きに咲くのですが、花びらがペロッと上にめくれ上がる独特の形をしています。"},
                {q: "ウサギの耳が非常に大きく発達している、音を聞く以外の重要な理由は？", a: ["体温を逃がして調節するため", "空を飛ぶため", "仲間を威嚇するため", "食べ物を包むため"], ans: "体温を逃がして調節するため", h: "耳の表面にたくさんの毛細血管が走っており、風に当てて血液を冷やし、体温を下げます。"},
                {q: "世界最大のイカ「ダイオウイカ」の「目玉の直径」はどれくらいある？", a: ["約5cm", "約10cm", "約30cm", "約1メートル"], ans: "約30cm", h: "バレーボールやボウリングの球ほどの大きさがあり、生物界で最大級の目を持っています。"},
                {q: "マツやスギのように、種子（子房）がむき出しになっている植物の分類名は？", a: ["被子植物", "裸子植物", "コケ植物", "シダ植物"], ans: "裸子植物", h: "花びらがなく、胚珠がむき出し（裸）になっている古いタイプの植物です。"},
                {q: "世界で最も強い毒を持つとされるクラゲ「キロネックス（オーストラリアウンバチクラゲ）」の通称は？", a: ["殺人クラゲ", "電気クラゲ", "悪魔のクラゲ", "ハブクラゲ"], ans: "殺人クラゲ", h: "刺されると数分で心停止に陥ることがある、最恐の猛毒クラゲです。"},
                {q: "世界一素早く動く昆虫「オーストラリアオオハナムグリ」の幼虫の、驚きの移動方法は？", a: ["足を使わず、仰向け（背中）で這って進む", "超高速でジャンプする", "ウジ虫のように転がる", "他の虫の背中に乗る"], ans: "足を使わず、仰向け（背中）で這って進む", h: "ハナムグリの幼虫は、なぜかひっくり返って背中でクネクネと非常に素早く移動します。"},
                {q: "鳥のフラミンゴが、鮮やかなピンク色や赤色をしている理由はなぜ？", a: ["生まれつきの遺伝", "食べているエサ（エビや藻類）の成分", "日光浴による日焼け", "泥遊びの色が染みついた"], ans: "食べているエサ（エビや藻類）の成分", h: "エサに含まれる「カエロテノイド」という色素が羽に沈着するためで、エサを変えると白くなります。"},
                {q: "ナマコが敵に襲われた際、お尻から吐き出す強烈な対抗手段は何？", a: ["自分の内臓（おとり）", "猛毒のガス", "真っ黒な墨", "大量の砂"], ans: "自分の内臓（おとり）", h: "キュビエ器官と呼ばれる白い内臓を吐き出して敵を絡めとり、自分は逃げます（内臓は後で再生）。"},
                {q: "植物の『おじぎ草』の葉に触ると、ペタッと閉じておじぎをする理由は？", a: ["細胞の中の水分が移動して抜けるため", "筋肉が縮むため", "光が遮られるため", "枯れるため"], ans: "細胞の中の水分が移動して抜けるため", h: "接触刺激により、葉の付け根にある細胞から一瞬で水分が外へ抜けることで、しおれるように動きます。"},
                {q: "地球上の全生物の重量（バイオマス）のうち、最も大きな割合（約8割）を占めるのはどれ？", a: ["人間などの動物", "魚などの海洋生物", "昆虫", "植物"], ans: "植物", h: "地球全体の圧倒的な王者は、世界中に広がる森林や草地などの「植物」です。"},
                {q: "ミミズには「心臓」がある？", a: ["ない", "1つある", "5つのペア（計10個）ある", "100個以上ある"], ans: "5つのペア（計10個）ある", h: "側心臓と呼ばれる血管のポンプ構造が5対あり、全身に効率よく血液を循環させています。"},
                {q: "アサガオのツルが巻き付く方向は、上から見てどっち向きと決まっている？", a: ["時計回り（右巻き）", "反時計回り（左巻き）", "完全にランダム", "品種によって異なる"], ans: "反時計回り（右巻き）", h: "上から見ると常に左回り（反時計回り）に巻き付きながら上に伸びていきます（日本の定義では右巻きとも）。"},
                {q: "カタツムリが「コンクリートの壁」によくくっついている理由はなぜ？", a: ["日陰で涼しいため", "殻を作るためのカルシウムを削って食べるため", "道に迷いやすいため", "ただの休憩"], ans: "殻を作るためのカルシウムを削って食べるため", h: "コンクリートに含まれる炭酸カルシウムをヤスリのような舌で削り、自分の殻の栄養にしています。"}
            ]
        };

        // ゲーム状態変数
        let difficulty = "normal"; 
        let currentGenre = "normal";
        let usedQuestions = []; // 既出問題の記録配列
        let currentQuestion = null;

        let yushaHp = 100;
        let maxYushaHp = 100;
        let hissatsuGauge = 0;

        let currentEnemy = null;
        let maouHp = 100;
        let maouMaxHp = 100;

        let isSecretUnlocked = false; 
        let inputPattern = []; 

        // モンスターデータ
        const ENEMIES = {
            "slime":  { name: "うろこスライム", hp: 120, class: "monster-slime" },
            "ghost":  { name: "彷徨える漢字怨霊", hp: 160, class: "monster-ghost" },
            "dragon": { name: "原初のバイオドラゴン", hp: 220, class: "monster-dragon" },
            "oni":    { name: "裏魔王・カオスオニ", hp: 666, class: "monster-uramaou" }
        };

        // DOM要素キャッシュ
        const stageTitle = document.getElementById("stage-title");
        const enemyNameLabel = document.getElementById("enemy-name");
        const maouHpLabel = document.getElementById("maou-hp");
        const maouMaxHpLabel = document.getElementById("maou-max-hp");
        const maouBar = document.getElementById("maou-hp-bar");

        const yushaHpLabel = document.getElementById("yusha-hp");
        const yushaMaxHpLabel = document.getElementById("yusha-max-hp");
        const yushaBar = document.getElementById("yusha-hp-bar");
        const hissatsuGaugeLabel = document.getElementById("hissatsu-gauge");
        const hissatsuBar = document.getElementById("hissatsu-gauge-bar");

        const logBox = document.getElementById("log-box");
        const hintBox = document.getElementById("hint-box");
        const btnHint = document.getElementById("btn-hint");
        const hissatsuBox = document.getElementById("hissatsu-box");
        const btnHissatsu = document.getElementById("btn-hissatsu");
        const interactionBox = document.getElementById("interaction-box");
        const enemyGraphic = document.getElementById("enemy-graphic");

        // 難易度選択の隠しコマンド監視
        window.addEventListener("keydown", (e) => {
            if (document.getElementById("difficulty-screen").style.display !== "none") {
                inputPattern.push(e.key);
                if (inputPattern.length > 4) inputPattern.shift();
                if (inputPattern.join("").toLowerCase() === "oni") {
                    triggerSecretMode();
                }
            }
        });

        function triggerSecretMode() {
            if (isSecretUnlocked) return;
            isSecretUnlocked = true;
            document.getElementById("btn-oni-mode").style.display = "block";
            document.getElementById("menu-title").innerText = "💀 禁断の扉が開かれた。難易度をえらべ 💀";
            document.getElementById("menu-title").style.color = "#ff00ff";
            addLog("🔮 暗黒コマンドを検知！ 難易度『鬼ムズ』が開放された！");
        }

        // 難易度選択
        function selectDifficulty(mode) {
            difficulty = mode;
            if (mode === "easy") {
                maxYushaHp = 150; yushaHp = 150;
                addLog("⚔️ 難易度【らくらく】が選ばれた。HPが上昇、敵のHPが低下します。");
            } else if (mode === "normal") {
                maxYushaHp = 100; yushaHp = 100;
                addLog("⚔️ 難易度【ふつう】が選ばれた。標準的なバランスです。");
            } else if (mode === "hard") {
                maxYushaHp = 80; yushaHp = 80;
                addLog("⚔️ 難易度【げきから】が選ばれた。HPが減少、敵のHPが上昇します。");
            } else if (mode === "oni") {
                maxYushaHp = 50; yushaHp = 50;
                addLog("💀 難易度【鬼ムズ】が選ばれた。絶望の戦いが始まる...");
            }
            updateHpView();

            if (mode === "oni") {
                selectGenre("oni");
            } else {
                document.getElementById("difficulty-screen").style.display = "none";
                document.getElementById("genre-screen").style.display = "flex";
            }
        }

        function openKanjiMenu() {
            document.getElementById("genre-screen").style.display = "none";
            document.getElementById("kanji-sub-screen").style.display = "flex";
        }
        function backToGenre() {
            document.getElementById("kanji-sub-screen").style.display = "none";
            document.getElementById("genre-screen").style.display = "flex";
        }

        // ジャンル決定・ゲーム開始時の処理
        function selectGenre(genreKey) {
            currentGenre = genreKey;
            usedQuestions = []; // ★ジャンル開始時に既出問題の記録を確実にリセット
            
            document.getElementById("genre-screen").style.display = "none";
            document.getElementById("kanji-sub-screen").style.display = "none";
            document.getElementById("difficulty-screen").style.display = "none";

            // モンスター選定
            if (difficulty === "oni") {
                currentEnemy = Object.assign({}, ENEMIES["oni"]);
            } else {
                if (genreKey === "normal") {
                    currentEnemy = Object.assign({}, ENEMIES["slime"]);
                } else if (genreKey.startsWith("kanji")) {
                    currentEnemy = Object.assign({}, ENEMIES["ghost"]);
                } else if (genreKey === "bio") {
                    currentEnemy = Object.assign({}, ENEMIES["dragon"]);
                }
            }

            // 倍率計算
            let rate = 1.0;
            if (difficulty === "easy") rate = 0.6;
            if (difficulty === "hard") rate = 1.5;
            if (difficulty === "oni") rate = 2.5;

            currentEnemy.hp = Math.round(currentEnemy.hp * rate);
            maouHp = currentEnemy.hp;
            maouMaxHp = currentEnemy.hp;

            enemyNameLabel.innerText = currentEnemy.name;
            enemyGraphic.className = ""; 
            enemyGraphic.classList.add(currentEnemy.class);

            logBox.innerHTML = "";
            addLog(`👾 ${currentEnemy.name} があらわれた！`);
            updateEnemyHpView();

            nextQuestion();
        }

        // 出題処理
        function nextQuestion() {
            let pool = [];
            if (difficulty === "oni") {
                // 鬼ムズは全ジャンル混合カオスプール
                pool = pool.concat(QUIZ_DATABASE["normal"], QUIZ_DATABASE["kanji_yomi"], QUIZ_DATABASE["kanji_fish"], QUIZ_DATABASE["kanji_animal"], QUIZ_DATABASE["kanji_bug"], QUIZ_DATABASE["kanji_bird"], QUIZ_DATABASE["bio"]);
            } else {
                pool = QUIZ_DATABASE[currentGenre];
            }

            // まだ使われていない問題(usedQuestionsに含まれないもの)だけに絞り込む
            let available = pool.filter(q => !usedQuestions.includes(q));

            // 全問消化時は自動リセット
            if (available.length === 0) {
                addLog("🔮 知識の泉が枯れ果てた！(全問消化のためリセットされます)");
                usedQuestions = [];
                available = pool;
            }

            let randomIndex = Math.floor(Math.random() * available.length);
            currentQuestion = available[randomIndex];
            usedQuestions.push(currentQuestion); // 解いた問題を記録
            renderQuestion(currentQuestion);
        }

        // クイズUI描画
        function renderQuestion(qData) {
            hintBox.style.display = "block";
            btnHint.disabled = (hissatsuGauge < 25);

            let isDescription = (typeof qData.a === "undefined"); 

            if (isDescription) {
                // 記述式UI
                interactionBox.innerHTML = `
                    <div class="question-text">${qData.q}</div>
                    <hr>
                    <div class="typed-box">
                        <input type="text" id="typed-ans" class="answer-input" placeholder="ひらがなで入力せよ" autocomplete="off">
                        <button class="btn-attack" id="btn-submit" onclick="checkTypedAnswer()">攻撃!</button>
                    </div>
                `;
                document.getElementById("typed-ans").addEventListener("keypress", function(e) {
                    if (e.key === "Enter") checkTypedAnswer();
                });
                setTimeout(() => document.getElementById("typed-ans").focus(), 100);
            } else {
                // 4択式UI
                let choicesHtml = "";
                let choices = [...qData.a]; 
                
                // 鬼モード以外は選択肢をシャッフル
                if (difficulty !== "oni") {
                    choices.sort(() => Math.random() - 0.5);
                }

                choices.forEach(choice => {
                    choicesHtml += `<button class="btn-choice" onclick="checkChoiceAnswer('${choice}')">${choice}</button>`;
                });

                interactionBox.innerHTML = `
                    <div class="question-text">${qData.q}</div>
                    <hr>
                    <div class="choices-box">${choicesHtml}</div>
                `;
            }
        }

        // 4択判定
        function checkChoiceAnswer(chosen) {
            disableAllInputs();
            if (chosen === currentQuestion.ans) {
                handleCorrect();
            } else {
                handleWrong(chosen);
            }
        }

        // 記述判定
        function checkTypedAnswer() {
            const inputField = document.getElementById("typed-ans");
            if (!inputField) return;
            let userAns = inputField.value.trim().replace(/[\u30a1-\u30f6]/g, function(match) {
                return String.fromCharCode(match.charCodeAt(0) - 0x60); // カタカナをひらがなに変換
            });

            if (!userAns) return;

            disableAllInputs();
            if (userAns === currentQuestion.ans) {
                handleCorrect();
            } else {
                handleWrong(userAns);
            }
        }

        // 全入力制限
        function disableAllInputs() {
            const btns = interactionBox.querySelectorAll("button, input");
            btns.forEach(b => b.disabled = true);
            btnHint.disabled = true;
        }

        // 正解の処理
        function handleCorrect() {
            flashScreen("effect-blue");
            playSlashAnimation();

            let baseDmg = 25;
            if (difficulty === "easy") baseDmg = 40;
            if (difficulty === "hard") baseDmg = 20;
            if (difficulty === "oni") baseDmg = 15;

            // クリティカル判定
            let isCrit = Math.random() < 0.25;
            let finalDmg = isCrit ? Math.round(baseDmg * 1.8) : baseDmg;

            maouHp -= finalDmg;
            if (maouHp < 0) maouHp = 0;

            let logMsg = isCrit ? `✨ 会心の一撃！ ${currentEnemy.name} に ${finalDmg} のダメージ！` : `⚔️ 正解！ ${currentEnemy.name} に ${finalDmg} のダメージ！`;
            addLog(logMsg);
            updateEnemyHpView();
            shakeEnemyGraphic();

            // 必殺ゲージ上昇
            let gaugeGain = isCrit ? 35 : 20;
            hissatsuGauge += gaugeGain;
            if (hissatsuGauge > 100) hissatsuGauge = 100;
            updateGaugeView();

            if (maouHp <= 0) {
                setTimeout(winGame, 600);
            } else {
                setTimeout(nextQuestion, 800);
            }
        }

        // 不正解の処理
        function handleWrong(userAns) {
            flashScreen("effect-red");

            let dmg = 20;
            if (difficulty === "easy") dmg = 10;
            if (difficulty === "hard") dmg = 35;
            if (difficulty === "oni") dmg = 50; // 即死級

            yushaHp -= dmg;
            if (yushaHp < 0) yushaHp = 0;

            addLog(`❌ 不正解！(あなたの回答: ${userAns})`);
            addLog(`💥 ${currentEnemy.name} の反撃！ ${dmg} のダメージを受けた！`);
            addLog(`💡 正解は「${currentQuestion.ans}」でした。`);
            updateHpView();

            if (yushaHp <= 0) {
                setTimeout(gameOver, 600);
            } else {
                setTimeout(nextQuestion, 1500);
            }
        }

        // ヒントシステム
        function useHint() {
            if (hissatsuGauge < 25) return;
            hissatsuGauge -= 25;
            updateGaugeView();
            btnHint.disabled = true;

            addLog(`🔮 予知能力を発動：【ヒント】${currentQuestion.h}`);
        }

        // 必殺技システム
        function triggerHissatsu() {
            if (hissatsuGauge < 100) return;
            hissatsuGauge = 0;
            updateGaugeView();

            disableAllInputs();
            flashScreen("effect-green");
            playUltimateAnimation();

            let hDmg = 80;
            if (difficulty === "easy") hDmg = 120;
            if (difficulty === "oni") hDmg = 50;

            maouHp -= hDmg;
            if (maouHp < 0) maouHp = 0;

            addLog(`⚡ 秘技・賢者の一撃！ ${currentEnemy.name} に ${hDmg} の絶大ダメージ！`);
            updateEnemyHpView();
            shakeEnemyGraphic();

            if (maouHp <= 0) {
                setTimeout(winGame, 800);
            } else {
                setTimeout(nextQuestion, 1000);
            }
        }

        // 画面演出
        function addLog(msg) {
            logBox.innerHTML += `<div>${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateHpView() {
            yushaHpLabel.innerText = yushaHp;
            yushaMaxHpLabel.innerText = maxYushaHp;
            let pct = (yushaHp / maxYushaHp) * 100;
            yushaBar.style.width = pct + "%";
            if (pct < 30) yushaBar.style.background = "#ff3333";
            else if (pct < 60) yushaBar.style.background = "#ffaa00";
            else yushaBar.style.background = "#00ff00";
        }

        function updateEnemyHpView() {
            maouHpLabel.innerText = maouHp;
            maouMaxHpLabel.innerText = maouMaxHp;
            let pct = (maouHp / maouMaxHp) * 100;
            maouBar.style.width = pct + "%";
        }

        function updateGaugeView() {
            hissatsuGaugeLabel.innerText = hissatsuGauge;
            hissatsuBar.style.width = hissatsuGauge + "%";
            btnHissatsu.disabled = (hissatsuGauge < 100);
            btnHint.disabled = (hissatsuGauge < 25);
        }

        function flashScreen(className) {
            const st = document.getElementById("stage");
            st.classList.add(className);
            setTimeout(() => st.classList.remove(className), 250);
        }

        function playSlashAnimation() {
            const sl = document.getElementById("slash-line");
            sl.classList.add("animate-slash");
            setTimeout(() => sl.classList.remove("animate-slash"), 250);
        }

        function playUltimateAnimation() {
            const ub = document.getElementById("ultimate-break");
            ub.classList.add("animate-ultimate");
            setTimeout(() => ub.classList.remove("animate-ultimate"), 800);
        }

        function shakeEnemyGraphic() {
            const eg = document.getElementById("enemy-graphic");
            eg.classList.add("shake");
            setTimeout(() => eg.classList.remove("shake"), 300);
        }

        function winGame() {
            interactionBox.innerHTML = `
                <div style="color:#00ff00; font-weight:bold; font-size:18px; margin-bottom:4px;">🎉 CONGRATULATIONS! 🎉</div>
                <div style="font-size:14px; margin-bottom:10px;">世界の全知識を解き明かし、平和を取り戻した！</div>
                <button class="btn-retry" onclick="backToTitle()" style="border-color:#00ff00; color:#00ff00; font-weight: bold;">▶ タイトルに戻って他のジャンルに挑む</button>
            `;
            hissatsuBox.style.display = "none";
            hintBox.style.display = "none";
        }

        function gameOver() {
            interactionBox.innerHTML = `
                <div style="color:#ff3333; font-weight:bold; font-size:18px; margin-bottom:4px;">💀 GAME OVER 💀</div>
                <div style="font-size:14px; margin-bottom:10px;">知識が足りず、力尽きてしまった...</div>
                <button class="btn-retry" onclick="backToTitle()" style="border-color:#ff3333; color:#ff3333; font-weight: bold;">▶ タイトルに戻ってリベンジする</button>
            `;
            hissatsuBox.style.display = "none";
            hintBox.style.display = "none";
        }

        // タイトルへ戻る処理（初期化）
        function backToTitle() {
            yushaHp = maxYushaHp;
            hissatsuGauge = 0;
            usedQuestions = []; // ★タイトルへ戻る時にも既出問題の配列を確実にクリア
            inputPattern = []; 

            document.getElementById("difficulty-screen").style.display = "flex";
            document.getElementById("genre-screen").style.display = "none";
            document.getElementById("kanji-sub-screen").style.display = "none";
            
            if (isSecretUnlocked) {
                document.getElementById("btn-oni-mode").style.display = "block";
                document.getElementById("menu-title").innerText = "💀 禁断の扉が開かれた。難易度をえらべ 💀";
                document.getElementById("menu-title").style.color = "#ff00ff";
            } else {
                document.getElementById("btn-oni-mode").style.display = "none";
                document.getElementById("menu-title").innerText = "⚔️ 難易度 を えらんでください ⚔️";
                document.getElementById("menu-title").style.color = "#ffcc00";
            }
            
            hissatsuBox.style.display = "block";
            hintBox.style.display = "none"; 
            
            stageTitle.innerText = "知識の勇者 -クイズ討伐RPG-";
            enemyNameLabel.innerText = "-";
            maouHpLabel.innerText = "-";
            maouMaxHpLabel.innerText = "-";
            maouBar.style.width = "0%";
            enemyGraphic.className = "";
            
            updateHpView();
            updateGaugeView();
            
            logBox.innerHTML = "";
            addLog("⚔️ 再び冒険が始まります。難易度を選択してください。");
            
            interactionBox.innerHTML = "";
        }
    </script>
</body>
</html>
